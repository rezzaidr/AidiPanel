name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-installer:
    name: Lint Bash Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint install.sh
        run: shellcheck -S warning install.sh

      - name: Lint aidipanel CLI
        run: shellcheck -S warning aidipanel

      - name: Lint deploy-panel.sh
        run: shellcheck -S warning panel-app/deploy-panel.sh

      - name: Check bash syntax — install.sh
        run: bash -n install.sh

      - name: Check bash syntax — aidipanel
        run: bash -n aidipanel

      - name: Check bash syntax — deploy-panel.sh
        run: bash -n panel-app/deploy-panel.sh

  lint-php:
    name: Lint PHP Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: PHP syntax check (all files)
        run: find panel-app -name "*.php" -print0 | xargs -0 -n1 php -l

  release:
    name: Create Release Archive
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: [lint-installer, lint-php]
    steps:
      - uses: actions/checkout@v4

      - name: Package install script
        run: |
          cp install.sh install-aidipanel.sh
          tar -czf aidipanel-panel-app.tar.gz panel-app/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aidipanel-dist
          path: |
            install-aidipanel.sh
            aidipanel
            aidipanel-panel-app.tar.gz
